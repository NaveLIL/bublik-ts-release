name: Bug report
description: Сообщить о воспроизводимой ошибке Bublik
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте токены, `.env`, дампы и персональные данные. Уязвимости отправляйте через Security Advisory.
  - type: input
    id: version
    attributes:
      label: Версия и digest
      description: Тег релиза и sha256 digest Docker-образа.
      placeholder: v1.2.3 / sha256:...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС, версии Docker и Docker Compose.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Модуль
      options:
        - RegBattle / ПБ
        - Economy
        - Onboarding / Welcome
        - TempVoice
        - Teams
        - Vacation
        - BR rotation
        - Core / deployment
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Очищенные логи
      description: Удалите секреты, Discord ID и персональные данные.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Безопасность публикации
      options:
        - label: Я проверил, что отчёт не содержит секретов, дампов и персональных данных.
          required: true
        - label: Это не приватный отчёт об уязвимости.
          required: true
